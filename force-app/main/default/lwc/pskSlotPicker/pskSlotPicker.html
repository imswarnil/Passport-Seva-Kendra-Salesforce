<template>
    <lightning-card title="Book an Appointment" icon-name="standard:event" class="psk-card">
        <lightning-button-icon
            slot="actions"
            icon-name="utility:refresh"
            variant="border-filled"
            alternative-text="Refresh slots"
            title="Refresh slots"
            onclick={handleRefresh}
        ></lightning-button-icon>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template if:true={isLoadingOffices}>
                <div class="psk-state" role="status" aria-live="polite">
                    <lightning-spinner alternative-text="Loading offices" size="small"></lightning-spinner>
                    <p class="psk-state__text">Loading PSK offices&hellip;</p>
                </div>
            </template>

            <template if:true={hasOfficesError}>
                <div class="psk-state psk-state--error" role="alert">
                    <lightning-icon icon-name="utility:error" variant="error" size="small"></lightning-icon>
                    <p class="psk-state__text">{officesError}</p>
                </div>
            </template>

            <template if:true={noOffices}>
                <div class="psk-state" role="status">
                    <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                    <p class="psk-state__text">No active PSK offices are available.</p>
                </div>
            </template>

            <template if:true={hasOffices}>
                <lightning-combobox
                    label="PSK Office"
                    placeholder="Select an office"
                    options={officeOptions}
                    value={selectedOfficeId}
                    onchange={handleOfficeChange}
                    class="slds-m-bottom_x-small"
                ></lightning-combobox>

                <lightning-input
                    type="date"
                    label="Appointment date"
                    value={selectedDate}
                    min={minDate}
                    onchange={handleDateChange}
                ></lightning-input>

                <template if:true={showPrompt}>
                    <p class="psk-state__text slds-m-top_small">Select an office to see available slots.</p>
                </template>

                <template if:true={isLoadingSlots}>
                    <div class="psk-state" role="status" aria-live="polite">
                        <lightning-spinner alternative-text="Loading slots" size="small"></lightning-spinner>
                        <p class="psk-state__text">Checking capacity&hellip;</p>
                    </div>
                </template>

                <template if:true={hasSlotsError}>
                    <div class="psk-state psk-state--error" role="alert">
                        <lightning-icon icon-name="utility:error" variant="error" size="small"></lightning-icon>
                        <p class="psk-state__text">{slotsError}</p>
                    </div>
                </template>

                <template if:true={showNoSlots}>
                    <div class="psk-state" role="status">
                        <lightning-icon icon-name="utility:events" size="small"></lightning-icon>
                        <p class="psk-state__text">No slots published for that office and date.</p>
                    </div>
                </template>

                <template if:true={hasSlots}>
                    <div
                        class="psk-slot-grid"
                        role="group"
                        aria-label="Available appointment slots"
                    >
                        <template for:each={slotTiles} for:item="slot">
                            <button
                                key={slot.key}
                                type="button"
                                class={slot.tileClass}
                                data-id={slot.id}
                                disabled={slot.disabled}
                                aria-label={slot.ariaLabel}
                                onclick={handleBook}
                            >
                                <span class="psk-slot__time">{slot.timeLabel}</span>
                                <span class="psk-slot__track" aria-hidden="true">
                                    <span class="psk-slot__fill" style={slot.fillStyle}></span>
                                </span>
                                <span class="psk-slot__capacity">{slot.capacityLabel}</span>
                                <template if:true={slot.isFull}>
                                    <span class="psk-slot__full">Full</span>
                                </template>
                            </button>
                        </template>
                    </div>
                    <p class="psk-slot-legend">
                        <span class="psk-slot-legend__swatch psk-slot-legend__swatch--open"></span> Open
                        <span class="psk-slot-legend__swatch psk-slot-legend__swatch--busy"></span> Filling up
                        <span class="psk-slot-legend__swatch psk-slot-legend__swatch--full"></span> Near capacity
                    </p>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
