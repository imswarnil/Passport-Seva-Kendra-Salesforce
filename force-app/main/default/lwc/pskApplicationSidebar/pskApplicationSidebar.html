<template>
    <div class="psk-sidebar">
        <template if:true={hasError}>
            <div class="slds-p-around_small psk-sidebar__error">
                <lightning-formatted-text value={error}></lightning-formatted-text>
            </div>
        </template>

        <lightning-card title="Quick Actions" icon-name="standard:flow" class="psk-sidebar__card">
            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <template if:true={hasNextStep}>
                    <lightning-button
                        variant="brand"
                        label={nextStepLabel}
                        class="psk-action-button slds-m-bottom_x-small"
                        disabled={actionsDisabled}
                        onclick={handleAdvance}
                    ></lightning-button>
                </template>
                <template if:true={canReject}>
                    <lightning-button
                        variant="destructive-text"
                        label="Reject Application"
                        class="psk-action-button"
                        disabled={actionsDisabled}
                        onclick={handleReject}
                    ></lightning-button>
                </template>
                <template if:true={isTerminal}>
                    <p class="psk-sidebar__caption">This application is in a final status ({status}).</p>
                </template>
            </div>
        </lightning-card>

        <lightning-card title="Application Snapshot" icon-name="standard:report" class="psk-sidebar__card">
            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <template if:true={isMinor}>
                    <div class="psk-minor-flag">Minor Applicant</div>
                </template>

                <div class="psk-sidebar__section">
                    <p class="psk-sidebar__section-title">Risk Score</p>
                    <c-psk-risk-meter score={riskScore}></c-psk-risk-meter>
                </div>

                <div class="psk-sidebar__section">
                    <p class="psk-sidebar__section-title">Documents</p>
                    <div class="psk-doc-track">
                        <div class="psk-doc-fill" style={documentsProgressStyle}></div>
                    </div>
                    <p class="psk-sidebar__caption">{documentsProgressLabel}</p>
                    <template if:true={hasDocumentsRejected}>
                        <p class="psk-sidebar__caption psk-sidebar__caption--danger">
                            {sidebar.documentsRejected} rejected
                        </p>
                    </template>
                </div>

                <div class="psk-sidebar__section">
                    <p class="psk-sidebar__section-title">Payment</p>
                    <template if:true={hasPayment}>
                        <span class={paymentBadgeClass}>{sidebar.paymentStatus}</span>
                        <p class="psk-sidebar__caption">
                            <lightning-formatted-number
                                value={sidebar.paymentAmount}
                                format-style="currency"
                                currency-code="INR"
                            ></lightning-formatted-number>
                        </p>
                    </template>
                    <template if:false={hasPayment}>
                        <p class="psk-sidebar__caption">No payment recorded</p>
                    </template>
                </div>

                <div class="psk-sidebar__section">
                    <p class="psk-sidebar__section-title">Police Verification</p>
                    <template if:true={hasPoliceVerification}>
                        <span class={pvBadgeClass}>{sidebar.policeVerificationStatus}</span>
                        <p class="psk-sidebar__caption">{sidebar.policeVerificationType}</p>
                    </template>
                    <template if:false={hasPoliceVerification}>
                        <p class="psk-sidebar__caption">Not yet initiated</p>
                    </template>
                </div>

                <div class="psk-sidebar__section psk-sidebar__section--last">
                    <p class="psk-sidebar__section-title">Risk Flags</p>
                    <span class={riskFlagBadgeClass}>{riskFlagLabel}</span>
                </div>
            </div>
        </lightning-card>
    </div>
</template>
