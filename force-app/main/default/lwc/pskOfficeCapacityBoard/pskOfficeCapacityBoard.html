<template>
    <lightning-card title="Slot Utilisation — Next 14 Days" icon-name="standard:calibration" class="psk-card">
        <lightning-button-icon
            slot="actions"
            icon-name="utility:refresh"
            variant="border-filled"
            alternative-text="Refresh utilisation"
            title="Refresh utilisation"
            onclick={handleRefresh}
        ></lightning-button-icon>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template if:true={showOfficePicker}>
                <lightning-combobox
                    label="PSK Office"
                    options={officeOptions}
                    value={selectedOfficeId}
                    onchange={handleOfficeChange}
                    class="psk-office-picker slds-m-bottom_x-small"
                ></lightning-combobox>
            </template>

            <template if:true={isLoading}>
                <div class="psk-state" role="status" aria-live="polite">
                    <lightning-spinner alternative-text="Loading utilisation" size="small"></lightning-spinner>
                    <p class="psk-state__text">Measuring slot utilisation&hellip;</p>
                </div>
            </template>

            <template if:true={hasError}>
                <div class="psk-state psk-state--error" role="alert">
                    <lightning-icon icon-name="utility:error" variant="error" size="small"></lightning-icon>
                    <p class="psk-state__text">{error}</p>
                </div>
            </template>

            <template if:true={isEmpty}>
                <div class="psk-state" role="status">
                    <lightning-icon icon-name="utility:events" size="small"></lightning-icon>
                    <p class="psk-state__text">No slots published for the next 14 days.</p>
                </div>
            </template>

            <template if:true={hasCells}>
                <p class="psk-summary">{averageLabel}</p>
                <template if:true={peakLabel}>
                    <p class="psk-summary psk-summary--muted">{peakLabel}</p>
                </template>

                <div class="psk-heat" role="img" aria-label={averageLabel}>
                    <template for:each={cells} for:item="cell">
                        <div key={cell.key} class="psk-heat__col" title={cell.ariaLabel}>
                            <span class="slds-assistive-text">{cell.ariaLabel}</span>
                            <div class="psk-heat__track" aria-hidden="true">
                                <div class={cell.cellClass} style={cell.barStyle}></div>
                            </div>
                            <span class="psk-heat__pct" aria-hidden="true">{cell.pctLabel}</span>
                            <span class="psk-heat__day" aria-hidden="true">{cell.dayNumber}</span>
                            <span class="psk-heat__weekday" aria-hidden="true">{cell.weekday}</span>
                        </div>
                    </template>
                </div>

                <p class="psk-legend">
                    <span class="psk-legend__swatch psk-legend__swatch--low"></span> &lt;40%
                    <span class="psk-legend__swatch psk-legend__swatch--medium"></span> 40&ndash;69%
                    <span class="psk-legend__swatch psk-legend__swatch--high"></span> 70&ndash;89%
                    <span class="psk-legend__swatch psk-legend__swatch--critical"></span> 90%+
                </p>
            </template>
        </div>
    </lightning-card>
</template>
