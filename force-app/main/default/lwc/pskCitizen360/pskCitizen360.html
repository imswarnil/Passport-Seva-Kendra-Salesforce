<template>
    <lightning-card title="Citizen 360" icon-name="standard:contact" class="psk-card">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template if:true={isBlacklisted}>
                <div class="psk-alert" role="alert">
                    <lightning-icon icon-name="utility:warning" variant="inverse" size="x-small"></lightning-icon>
                    <span>Blacklisted &mdash; {blacklistReason}</span>
                </div>
            </template>

            <header class="psk-identity">
                <div class="psk-identity__main">
                    <h2 class="psk-identity__name">{citizenName}</h2>
                    <p class="psk-identity__ref">Reference {citizenReference}</p>
                </div>
                <div class="psk-identity__badges">
                    <span class={kycBadgeClass}>KYC: {kycStatus}</span>
                    <span class={aadhaarBadgeClass}>{aadhaarLabel}</span>
                    <template if:true={isMinor}>
                        <span class="psk-badge psk-badge--gold">Minor</span>
                    </template>
                </div>
            </header>

            <dl class="psk-facts">
                <div class="psk-facts__item">
                    <dt>Age</dt>
                    <dd>{age}</dd>
                </div>
                <div class="psk-facts__item">
                    <dt>Mobile</dt>
                    <dd>{mobile}</dd>
                </div>
                <div class="psk-facts__item">
                    <dt>Email</dt>
                    <dd>{email}</dd>
                </div>
                <div class="psk-facts__item">
                    <dt>Location</dt>
                    <dd>{location}</dd>
                </div>
                <div class="psk-facts__item">
                    <dt>Language</dt>
                    <dd>{language}</dd>
                </div>
            </dl>

            <div class="psk-risk">
                <p class="psk-section-title">Aggregate Risk</p>
                <c-psk-risk-meter score={riskScore}></c-psk-risk-meter>
            </div>

            <template if:true={isLoading}>
                <div class="psk-state" role="status" aria-live="polite">
                    <lightning-spinner alternative-text="Loading citizen profile" size="small"></lightning-spinner>
                    <p class="psk-state__text">Assembling the citizen profile&hellip;</p>
                </div>
            </template>

            <template if:true={hasError}>
                <div class="psk-state psk-state--error" role="alert">
                    <lightning-icon icon-name="utility:error" variant="error" size="small"></lightning-icon>
                    <p class="psk-state__text">{profileError}</p>
                    <lightning-button label="Retry" onclick={handleRetry}></lightning-button>
                </div>
            </template>

            <template if:true={showBody}>
                <lightning-tabset variant="scoped" active-tab-value={activeTab} class="psk-tabs">
                    <lightning-tab label={applicationsTabLabel} value="applications">
                        <template if:true={hasApplications}>
                            <ul class="psk-list">
                                <template for:each={applications} for:item="row">
                                    <li key={row.key} class="psk-list__item">
                                        <button
                                            type="button"
                                            class="psk-list__link"
                                            data-id={row.id}
                                            data-object={row.objectApiName}
                                            onclick={handleOpenRecord}
                                        >
                                            {row.title}
                                        </button>
                                        <span class="psk-list__meta">
                                            <template if:true={row.status}>{row.status}</template>
                                            <template if:true={row.subtitle}> &middot; {row.subtitle}</template>
                                        </span>
                                        <template if:true={row.timestamp}>
                                            <span class="psk-list__date">
                                                <lightning-formatted-date-time
                                                    value={row.timestamp}
                                                    year="numeric"
                                                    month="short"
                                                    day="2-digit"
                                                ></lightning-formatted-date-time>
                                            </span>
                                        </template>
                                    </li>
                                </template>
                            </ul>
                        </template>
                        <template if:false={hasApplications}>
                            <p class="psk-state__text slds-p-around_small">No applications on record.</p>
                        </template>
                    </lightning-tab>

                    <lightning-tab label={passportsTabLabel} value="passports">
                        <template if:true={hasPassports}>
                            <ul class="psk-list">
                                <template for:each={passports} for:item="row">
                                    <li key={row.key} class="psk-list__item">
                                        <button
                                            type="button"
                                            class="psk-list__link"
                                            data-id={row.id}
                                            data-object={row.objectApiName}
                                            onclick={handleOpenRecord}
                                        >
                                            {row.title}
                                        </button>
                                        <span class="psk-list__meta">
                                            <template if:true={row.status}>{row.status}</template>
                                            <template if:true={row.subtitle}> &middot; {row.subtitle}</template>
                                        </span>
                                        <template if:true={row.timestamp}>
                                            <span class="psk-list__date">
                                                expires
                                                <lightning-formatted-date-time
                                                    value={row.timestamp}
                                                    year="numeric"
                                                    month="short"
                                                    day="2-digit"
                                                    time-zone="UTC"
                                                ></lightning-formatted-date-time>
                                            </span>
                                        </template>
                                    </li>
                                </template>
                            </ul>
                        </template>
                        <template if:false={hasPassports}>
                            <p class="psk-state__text slds-p-around_small">No passports issued yet.</p>
                        </template>
                    </lightning-tab>

                    <lightning-tab label={familyTabLabel} value="family">
                        <template if:true={hasFamily}>
                            <ul class="psk-list">
                                <template for:each={familyMembers} for:item="row">
                                    <li key={row.key} class="psk-list__item">
                                        <button
                                            type="button"
                                            class="psk-list__link"
                                            data-id={row.id}
                                            data-object={row.objectApiName}
                                            onclick={handleOpenRecord}
                                        >
                                            {row.title}
                                        </button>
                                        <span class="psk-list__meta">
                                            <template if:true={row.status}>{row.status}</template>
                                            <template if:true={row.subtitle}> &middot; {row.subtitle}</template>
                                        </span>
                                    </li>
                                </template>
                            </ul>
                        </template>
                        <template if:false={hasFamily}>
                            <p class="psk-state__text slds-p-around_small">No family members linked.</p>
                        </template>
                    </lightning-tab>
                </lightning-tabset>
            </template>
        </div>
    </lightning-card>
</template>
