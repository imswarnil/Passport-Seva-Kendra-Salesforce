<template>
    <div class="psk-validator">
        <header class="psk-validator__banner">
            <div class="psk-validator__crest" aria-hidden="true">
                <svg viewBox="0 0 40 40" width="36" height="36" focusable="false">
                    <circle cx="20" cy="20" r="19" fill="none" stroke="#c9a227" stroke-width="1.5" />
                    <path d="M12 20.5 L17.5 26 L28 15" fill="none" stroke="#c9a227" stroke-width="3" stroke-linecap="round" />
                </svg>
            </div>
            <div>
                <p class="psk-validator__eyebrow">Passport Seva Kendra</p>
                <h1 class="psk-validator__title">Passport Validator</h1>
                <p class="psk-validator__subtitle">Counter verification of a passport booklet</p>
            </div>
        </header>

        <div class="psk-validator__inner">
            <div class="psk-search" role="search">
                <lightning-input
                    type="search"
                    label="Passport number"
                    placeholder="e.g. Z1234567"
                    value={inputValue}
                    onchange={handleInput}
                    onkeyup={handleKeyup}
                    class="psk-search__input"
                ></lightning-input>
                <div class="psk-search__actions">
                    <lightning-button
                        label="Validate"
                        variant="brand"
                        class="psk-button-gold"
                        disabled={searchDisabled}
                        onclick={handleSearch}
                    ></lightning-button>
                    <lightning-button label="Clear" onclick={handleClear}></lightning-button>
                </div>
            </div>

            <template if:true={showIdlePrompt}>
                <div class="psk-state" role="status">
                    <lightning-icon icon-name="utility:search" size="small"></lightning-icon>
                    <p class="psk-state__text">
                        Enter a passport number and select <strong>Validate</strong> to check its status against the
                        register.
                    </p>
                </div>
            </template>

            <template if:true={isLoading}>
                <div class="psk-state" role="status" aria-live="polite">
                    <lightning-spinner alternative-text="Checking the register" size="small"></lightning-spinner>
                    <p class="psk-state__text">Checking the register&hellip;</p>
                </div>
            </template>

            <template if:true={hasError}>
                <div class="psk-state psk-state--error" role="alert">
                    <lightning-icon icon-name="utility:error" variant="error" size="small"></lightning-icon>
                    <p class="psk-state__text">{error}</p>
                </div>
            </template>

            <template if:true={hasVerdict}>
                <div class={verdictClass} role="status" aria-live="polite">
                    <lightning-icon
                        icon-name={verdictIcon}
                        variant="inverse"
                        size="small"
                        class="psk-verdict__icon"
                    ></lightning-icon>
                    <div>
                        <p class="psk-verdict__headline">{verdictHeadline}</p>
                        <p class="psk-verdict__detail">{verdictDetail}</p>
                    </div>
                    <span class="psk-verdict__number">{passportNumber}</span>
                </div>

                <template if:true={hasPassport}>
                    <dl class="psk-holder">
                        <div class="psk-holder__cell psk-holder__cell--wide">
                            <dt>Holder</dt>
                            <dd>{holderName}</dd>
                        </div>
                        <div class="psk-holder__cell">
                            <dt>Status</dt>
                            <dd>{statusLabel}</dd>
                        </div>
                        <div class="psk-holder__cell">
                            <dt>Validity</dt>
                            <dd>{daysLabel}</dd>
                        </div>
                        <div class="psk-holder__cell">
                            <dt>Date of issue</dt>
                            <dd>
                                <template if:true={dateOfIssue}>
                                    <lightning-formatted-date-time
                                        value={dateOfIssue}
                                        year="numeric"
                                        month="short"
                                        day="2-digit"
                                        time-zone="UTC"
                                    ></lightning-formatted-date-time>
                                </template>
                                <template if:false={dateOfIssue}>&mdash;</template>
                            </dd>
                        </div>
                        <div class="psk-holder__cell">
                            <dt>Date of expiry</dt>
                            <dd>
                                <template if:true={dateOfExpiry}>
                                    <lightning-formatted-date-time
                                        value={dateOfExpiry}
                                        year="numeric"
                                        month="short"
                                        day="2-digit"
                                        time-zone="UTC"
                                    ></lightning-formatted-date-time>
                                </template>
                                <template if:false={dateOfExpiry}>&mdash;</template>
                            </dd>
                        </div>
                        <div class="psk-holder__cell">
                            <dt>Category</dt>
                            <dd>{category}</dd>
                        </div>
                        <div class="psk-holder__cell">
                            <dt>Place of issue</dt>
                            <dd>{placeOfIssue}</dd>
                        </div>
                        <div class="psk-holder__cell">
                            <dt>ECR status</dt>
                            <dd>{ecrStatus}</dd>
                        </div>
                    </dl>

                    <div class="psk-holder__actions">
                        <lightning-button
                            label="Open passport record"
                            onclick={handleOpenPassport}
                        ></lightning-button>
                        <template if:true={citizenId}>
                            <lightning-button label="Open citizen" onclick={handleOpenCitizen}></lightning-button>
                        </template>
                    </div>
                </template>
            </template>
        </div>
    </div>
</template>
