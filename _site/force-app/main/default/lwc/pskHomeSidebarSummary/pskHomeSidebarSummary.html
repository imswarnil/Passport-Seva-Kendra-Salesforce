<template>
    <lightning-card title="By Record Type" icon-name="standard:record_lookup" class="psk-summary-card">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template if:true={hasError}>
                <lightning-formatted-text value={error}></lightning-formatted-text>
            </template>

            <lightning-input
                type="toggle"
                label={toggleLabel}
                checked={showCounts}
                message-toggle-active="Counts"
                message-toggle-inactive="Percentages"
                onchange={handleToggle}
                class="slds-m-bottom_small"
            ></lightning-input>

            <template if:true={hasRows}>
                <template for:each={rows} for:item="row">
                    <div key={row.key} class="psk-summary-row">
                        <span class="psk-summary-row__label">{row.label}</span>
                        <span class="psk-summary-row__value">{row.display}</span>
                    </div>
                </template>
            </template>
            <template if:false={hasRows}>
                <p class="slds-text-color_weak">No applications yet.</p>
            </template>
        </div>
    </lightning-card>
</template>
