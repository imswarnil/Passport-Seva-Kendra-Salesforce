<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
  <meta name="theme-color" content="{{ site.brand.navy }}" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1118" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
  {% include schema.html %}
  {% include adsense-head.html %}
  <script>
    /* Applied before first paint so a dark-theme visitor never sees a white
       flash. Kept inline and tiny for exactly that reason. */
    (function () {
      var el = document.documentElement;
      /* Marks that JS is running. Scroll-reveal only hides content when this
         class is present, so a blocked or failed script leaves the page fully
         visible rather than blank. */
      el.className += ' js';
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') el.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body class="{{ page.body_class | default: 'page' }}">
  {{ content }}
  <script src="{{ '/assets/js/course.js' | relative_url }}" defer></script>
</body>
</html>
